[project]
name = "poetry-annotator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2.1",
    "demjson3>=3.0.6",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "json5>=0.12.1",
    "mlxtend>=0.23.4",
    "pandas>=2.3.1",
    "plotly>=6.3.0",
    "protobuf>=5.28.0,<6.0.0",
    "pybreaker>=1.4.0",
    "pydantic>=2.0.0",
    "pytz>=2025.2",
    "streamlit>=1.48.1",
    "tenacity>=9.1.2",
    "tqdm>=4.67.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
