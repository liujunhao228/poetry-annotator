; Poetry Annotator - 新项目配置模板
; 复制此文件为 config.ini 并根据需要修改配置项

[Project]
; 项目名称（建议与目录名一致）
name = my_project
; 配置版本
version = 1.0

[LLM]
; 默认使用的模型配置别名（必须与下方 [Model.xxx] 的 xxx 一致）
default_model = gpt-4o
; 最大并发工作线程数
max_workers = 4
; 最大模型流水线数量
max_model_pipelines = 2
; 最大重试次数
max_retries = 3
; 重试延迟（秒）
retry_delay = 2

[Database]
; 数据库文件路径（相对于项目根目录）
; 支持单数据库：db_path = data/poetry.db
; 或多数据库：db_paths = default=data/poetry.db,backup=data/backup.db
db_path = data/poetry.db

[Data]
; 源数据目录（相对于项目根目录）
source_dir = data/source_json
; 输出结果目录（相对于项目根目录）
output_dir = data/output

[Categories]
; 情感分类体系文件路径（相对于项目根目录）
xml_path = data/categories.xml
md_path = data/classification_schema.md

[Prompt]
; 提示词模板文件路径（相对于项目根目录）
template_path = data/prompt_template.txt
system_prompt_instruction_template = data/system_prompt_instruction.txt
system_prompt_example_template = data/system_prompt_example.txt
user_prompt_template = data/user_prompt_template.txt

[Logging]
; 控制台日志级别：DEBUG, INFO, WARNING, ERROR
console_log_level = INFO
; 文件日志级别：DEBUG, INFO, WARNING, ERROR
file_log_level = DEBUG
; 启用控制台日志：true / false
enable_console_log = true
; 启用文件日志：true / false
enable_file_log = true
; 日志文件路径（相对于项目根目录）
log_file = logs/poetry_annotator.log
; 单个日志文件最大大小（MB）
max_file_size = 10
; 保留的备份日志文件数量
backup_count = 5
; 静音第三方库日志：true / false
quiet_third_party = true

[Visualizer]
; 启用自定义下载功能：true / false
enable_custom_download = false

; ============================================================
; Model Configurations - 模型配置
; ============================================================
; 使用 [Model.<your_alias>] 定义模型配置
; <your_alias> 是命令行中使用的名称，如：--model gpt-4o
; 复制下方模板添加新模型
; ============================================================

[Model.gpt-4o]
; 提供商：openai, siliconflow, gemini, anthropic 等
provider = openai
; 模型名称（提供商的 API 中使用的名称）
model_name = gpt-4o
; API 密钥（留空则从环境变量读取，如 OPENAI_API_KEY）
api_key = sk-your-api-key-here
; API 基础 URL
base_url = https://api.openai.com/v1/chat/completions
; 温度参数（0-2，越高越随机）
temperature = 0.7
; 最大生成 token 数
max_tokens = 1000
; 请求超时（秒）
timeout = 30
; 提示词模板（可选，不设置则使用上方全局配置）
; system_prompt_instruction_template = data/system_prompt_instruction.txt
; system_prompt_example_template = data/system_prompt_example.txt
; user_prompt_template = data/user_prompt_template.txt

